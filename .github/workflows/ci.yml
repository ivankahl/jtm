name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # The shell integration tests run in every shell that is installed. PowerShell and
      # bash come with every runner, and zsh with macOS.
      - name: Install zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # SPEC.md section 15: no core crate may name a first-party tool.
      - run: cargo xtask check-tool-names

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          # SPEC.md names macos-13, which GitHub has retired; macos-15-intel is
          # the remaining x64 macOS runner.
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            # The runner's JDK and Maven must be found, so `mvn -v` with a pinned Java is
            # tested at least here.
            require_real_tools: "1"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - name: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # A musl build on a glibc host must still detect the host's glibc.
            platform: linux-x64
            musl: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --all-targets --locked --target ${{ matrix.target }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
        env:
          JTM_EXPECTED_PLATFORM: ${{ matrix.platform }}
          JTM_REQUIRE_REAL_TOOLS: ${{ matrix.require_real_tools }}
