[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ivankahl/jtm"
authors = ["Ivan Kahl <hello@ivankahl.com>"]

[workspace.dependencies]
jtm-archive = { path = "crates/jtm-archive" }
jtm-core = { path = "crates/jtm-core" }
jtm-fetch = { path = "crates/jtm-fetch" }
jtm-plugin = { path = "crates/jtm-plugin" }
jtm-security = { path = "crates/jtm-security" }

assert_cmd = "2.2"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
indicatif = "0.18"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
junction = "2.1"
insta = { version = "1.49", features = ["json", "redactions"] }
minisign = { version = "0.10", default-features = false }
minisign-verify = "0.3"
mlua = { version = "0.12", features = ["luau", "vendored"] }
proptest = "1.12"
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
windows-sys = "0.61"
winreg = "0.56"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Hashing and (de)compression are slow unoptimised, and tests install real JDKs through them.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
