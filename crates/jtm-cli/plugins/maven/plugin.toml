# A first-party plugin, compiled into jtm (SPEC.md section 15). Its signing keys are jtm's
# root keys and are pre-approved only because this file is embedded in the binary.
#
# The root keys below are placeholders whose private keys were never kept, so nothing can sign
# for them; the root key ceremony (T6.5) replaces them in every first-party manifest at once.

schema = 1
name = "maven"
display_name = "Apache Maven"
description = "The Apache Maven build tool"
homepage = "https://maven.apache.org"
license = "Apache-2.0"
min_jtm = "0.1.0"

[versions]
scheme = "maven"
default_alias = "latest"

[aliases]
latest = { kind = "highest" }
"3" = { kind = "fixed", target = "3" }
"4" = { kind = "fixed", target = "4" }

# Maven runs on any platform, so one index with `"platform": "any"` serves them all.
[index]
url = "https://github.com/jtm-dev/index/releases/download/maven-{index_version}/maven-any.json"
signing_keys = [
  "RWRysDZolh28UjrMjL/6mCMDPnqfDtDj5Al+TxN8z6RkXGawmRo1ob7K",
  "RWTzLKb42g206mejNh0fzVSVIUErPPx9vwRRSf+bTzSu3b21Ok57nca0",
  "RWSNUwyhcXRhYMqQR0mQfp48nxBnT4qSHl01yqJKVPSJEIFmmj+XtONm",
]
threshold = 2
keys_url = "https://github.com/jtm-dev/index/releases/latest/download/keys.json"
format = 1

[layout]
strip_components = "auto"
bin_dirs = ["bin"]

[executables]
unix = ["mvn", "mvnDebug"]
windows = ["mvn.cmd", "mvnDebug.cmd"]

[env]
MAVEN_HOME = "{home}"
M2_HOME = "{home}"

# Maven 3.9 runs on Java 8; Maven 4 needs 17.
[requires]
java = ">=8"

[[interop]]
file = ".sdkmanrc"
parser = "keyvalue"
key = "maven"

[[interop]]
file = ".tool-versions"
parser = "tool-versions"
key = "maven"

[[interop]]
file = ".mvn/wrapper/maven-wrapper.properties"
parser = "wrapper"
key = "distributionUrl"
pattern = "apache-maven-{version}-bin.zip"
sha256_key = "distributionSha256Sum"
