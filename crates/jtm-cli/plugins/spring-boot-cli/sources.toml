# How CI discovers Spring Boot CLI versions and hashes (SPEC.md section 15). Only the index
# generator reads this file; it is not embedded in the jtm binary.

schema = 1

# Maven Central publishes a `.sha1` and a detached `.asc` signature beside each archive. SHA-1
# alone confirms nothing, so the generator also computes SHA-256 of the download and checks the
# signature before an entry is written.
[[source]]
id = "maven-central"
adapter = "maven-central"
role = "primary"
group = "org.springframework.boot"
artifact = "spring-boot-cli"
classifier = "bin"
extension = "zip"
hashes = ["sha1"]
signature = true
version_pattern = '^[2-9]\.\d+\.\d+$'
