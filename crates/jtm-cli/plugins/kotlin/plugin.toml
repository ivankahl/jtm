# A first-party plugin, compiled into jtm (SPEC.md section 15). Its signing key is jtm's
# root key and is pre-approved only because this file is embedded in the binary.
#
# The root key below is a placeholder whose private key was never kept, so nothing can sign
# for it; the root key ceremony (T6.5) replaces it in every first-party manifest at once with
# the maintainer's offline root key, backed up on encrypted offline media.

schema = 1
name = "kotlin"
display_name = "Kotlin"
description = "The Kotlin command-line compiler"
homepage = "https://kotlinlang.org"
license = "Apache-2.0"
min_jtm = "0.1.0"

[versions]
scheme = "semver-loose"
default_alias = "latest"

[aliases]
latest = { kind = "highest" }

# The compiler runs on any platform, so one index with `"platform": "any"` serves them all.
[index]
url = "https://github.com/jtm-dev/index/releases/latest/download/kotlin-any.json"
signing_keys = [
  "RWRysDZolh28UjrMjL/6mCMDPnqfDtDj5Al+TxN8z6RkXGawmRo1ob7K",
]
threshold = 1
keys_url = "https://github.com/jtm-dev/index/releases/latest/download/keys.json"
format = 1

[layout]
strip_components = "auto"
bin_dirs = ["bin"]

[env]
KOTLIN_HOME = "{home}"

[requires]
java = ">=8"

[[interop]]
file = ".sdkmanrc"
parser = "keyvalue"
key = "kotlin"

[[interop]]
file = ".tool-versions"
parser = "tool-versions"
key = "kotlin"
