# How CI discovers Java versions and hashes (SPEC.md section 15). Only the index generator
# reads this file; it is not embedded in the jtm binary.
#
# Temurin has two independent sources (the Adoptium API and the GitHub release sidecar). The
# other vendors have only Foojay, so each is marked `sole_source`: the generator accepts the
# checksum Foojay claims once its own download computes the same SHA-256, and records
# `computed:sha256` in the entry's provenance so such an entry can be told from one with two
# independent sources (SPEC.md section 15). A vendor signature Foojay links to is verified
# too once `signing_keys` names the vendor's public key files; until a key is pinned there,
# the signature is recorded as unverified and nothing more.
#
# The Foojay query parameters and the feature release lists below were written from the
# documented APIs and have not been run against the live services yet; the first CI run of the
# index workflow (T6.4) is where they get confirmed.

schema = 1

# ---------------------------------------------------------------------------------------------
# temurin
# ---------------------------------------------------------------------------------------------

# The Adoptium API lists every feature release it knows and the SHA-256 of each package.
[[source]]
id = "adoptium-api"
adapter = "adoptium"
role = "primary"
variant = "temurin"

# The `.sha256.txt` file Adoptium uploads beside each package in its GitHub release.
[[source]]
id = "github-sidecar"
adapter = "github-releases"
role = "confirm"
variant = "temurin"
repo = "adoptium/temurin{feature}-binaries"
features = [11, 17, 21, 25]
tag_pattern = 'jdk-(?P<version>\d+(?:\.\d+)*)\+(?P<build>\d+(?:\.\d+)?)'
version = "{version}+{build}"
hash_from = "sidecar"
sidecar_suffix = ".sha256.txt"
signature_suffix = ".sig"
[source.assets]
linux-x64 = "OpenJDK{feature}U-jdk_x64_linux_hotspot_{version}_{build}.tar.gz"
linux-aarch64 = "OpenJDK{feature}U-jdk_aarch64_linux_hotspot_{version}_{build}.tar.gz"
linux-musl-x64 = "OpenJDK{feature}U-jdk_x64_alpine-linux_hotspot_{version}_{build}.tar.gz"
windows-x64 = "OpenJDK{feature}U-jdk_x64_windows_hotspot_{version}_{build}.zip"
windows-aarch64 = "OpenJDK{feature}U-jdk_aarch64_windows_hotspot_{version}_{build}.zip"
macos-x64 = "OpenJDK{feature}U-jdk_x64_mac_hotspot_{version}_{build}.tar.gz"
macos-aarch64 = "OpenJDK{feature}U-jdk_aarch64_mac_hotspot_{version}_{build}.tar.gz"

# Java 8 tags are written `jdk8u432-b06`, which is `8.0.432+6` in the index.
[[source]]
id = "github-sidecar-8"
adapter = "github-releases"
role = "confirm"
variant = "temurin"
repo = "adoptium/temurin8-binaries"
tag_pattern = 'jdk8u(?P<update>\d+)-b(?P<pad>0*)(?P<build>\d+)'
version = "8.0.{update}+{build}"
hash_from = "sidecar"
sidecar_suffix = ".sha256.txt"
signature_suffix = ".sig"
[source.assets]
linux-x64 = "OpenJDK8U-jdk_x64_linux_hotspot_8u{update}b{pad}{build}.tar.gz"
linux-aarch64 = "OpenJDK8U-jdk_aarch64_linux_hotspot_8u{update}b{pad}{build}.tar.gz"
linux-musl-x64 = "OpenJDK8U-jdk_x64_alpine-linux_hotspot_8u{update}b{pad}{build}.tar.gz"
windows-x64 = "OpenJDK8U-jdk_x64_windows_hotspot_8u{update}b{pad}{build}.zip"
windows-aarch64 = "OpenJDK8U-jdk_aarch64_windows_hotspot_8u{update}b{pad}{build}.zip"
macos-x64 = "OpenJDK8U-jdk_x64_mac_hotspot_8u{update}b{pad}{build}.tar.gz"
macos-aarch64 = "OpenJDK8U-jdk_aarch64_mac_hotspot_8u{update}b{pad}{build}.tar.gz"

