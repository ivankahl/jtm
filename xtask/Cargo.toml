[package]
name = "xtask"
description = "Build helpers for jtm: embed snapshots, release packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
jtm-core.workspace = true
jtm-fetch.workspace = true
jtm-index = { path = "../crates/jtm-index" }
jtm-plugin.workspace = true
jtm-security.workspace = true
tempfile.workspace = true
toml.workspace = true

[dev-dependencies]
jtm-archive = { workspace = true, features = ["testing"] }
jtm-security = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
