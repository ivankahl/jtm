sonar.projectKey=ivankahl_jtm
sonar.organization=ivankahl


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=jtm
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Test code: integration tests, unit test modules (each in its own `tests.rs` or `*_tests.rs`
# file), test helpers, snapshots and proptest regressions. Everything else is source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=crates/*/tests/**,crates/*/src/**/tests.rs,crates/*/src/**/*_tests.rs,crates/*/src/testing.rs,crates/*/src/**/snapshots/**,crates/*/proptest-regressions/**
sonar.exclusions=crates/*/tests/**,crates/*/src/**/tests.rs,crates/*/src/**/*_tests.rs,crates/*/src/testing.rs,crates/*/src/**/snapshots/**,crates/*/proptest-regressions/**

# Written by `cargo llvm-cov` in the Sonar workflow.
sonar.rust.lcov.reportPaths=lcov.info
